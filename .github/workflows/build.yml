name: build

# LitePortal 的 CI 门禁。
#
# 必做三步，缺任一步，门禁即形同虚设：
#   1) 安装依赖
#   2) lint / 格式检查
#   3) 测试（不得改成 `|| true`，不得把失败降级为 warning）
#
# 命令必须与 AGENTS.md §2「常用命令」完全一致。
# job 名必须为 `test`（GitHub 分支保护 required status checks 依赖它）。

on:
  push:
    # 唯一主分支 main（2026-10-05 由 master 改名；2026-10-07 起废弃 develop）
    branches: [main]
  pull_request:

permissions:
  contents: read

# runner 镜像显式钉版本，不跟随 ubuntu-latest：隐式跟随会在 GitHub 切换镜像时
# 让 CI 行为突变（例如系统依赖包名变化）。升级镜像前请先在分支上验证。
jobs:
  test:
    name: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          # ⚠️ 必须显式指定 go.sum 位置：setup-go 的缓存默认在**仓库根目录**
          # 查找 go.sum，而本项目 Go 模块位于 backend/ 子目录，导致缓存始终
          # 恢复失败（"Dependencies file is not found ... go.sum"），
          # 每次 CI 都重新下载全部依赖。此配置让缓存真正生效。
          cache-dependency-path: backend/go.sum

      # ② lint / 格式检查（Go）
      - name: Go vet
        working-directory: backend
        run: go vet ./...

      - name: gofmt check
        working-directory: backend
        run: test -z "$(gofmt -l .)"

      # ③ 测试（Go 后端已补齐真实测试，不再存在 --passWithNoTests 假绿）
      - name: Go test
        working-directory: backend
        run: go test ./...

      # ── 前端门禁（G4）────────────────────────────────────────
      # 同样三步，且不得弱化上面后端的任何一步。
      #
      # ⚠️ 步骤顺序不可调换：setup-node 的 `cache: pnpm` 会调用 `pnpm --version`
      # 去解析 pnpm store 路径，若 pnpm 尚未安装，该步骤会直接失败并中止 job
      # （Unable to locate executable file: pnpm），后端之后的门禁一步都跑不到。
      # 故必须「先装 pnpm，再 setup-node（带缓存）」。
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: '8.15.5' # 与 docs/configuration.md §1 声明的版本一致

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # lint 只拦 error（--quiet）；存量技术债以 warning 形式可见但不阻塞，
      # 详见 eslint.config.js 中「存量技术债」段与 ROADMAP G4
      - name: Lint (frontend)
        working-directory: frontend
        run: pnpm run lint

      - name: Format check (frontend)
        working-directory: frontend
        run: pnpm run format:check

      # vitest 无 --passWithNoTests 之类的开关：无测试时 vitest 会以
      # "No test files found" 非零退出，故不存在 jest 式的假绿
      - name: Test (frontend)
        working-directory: frontend
        run: pnpm run test

      # 类型检查并入 CI：tsc 是本项目前端最严格的门禁之一
      - name: Typecheck (frontend)
        working-directory: frontend
        run: pnpm run typecheck
