name: Build Native Executables

# 发布链路：打 `v*` tag 时产出三平台原生可执行文件，并作为附件上传到该 tag 的 Release。
#
# 产物结构与本地 `bash build.sh` 完全一致（三条链路同构）：
#   server(.exe) + web/ + migrations/schema.sql + .env
# 必须打成 zip —— 只给裸二进制的话，用户解压后没有 web/ 与建表 SQL，跑不起来。
#
# 触发器：
#   - push tag `v*`      ：正式发版（同时上传 Release 附件）
#   - workflow_dispatch  ：手动试跑，只验证构建与打包，跳过 Release 上传

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  pkg:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
            artifact_name: server-linux
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ''
            artifact_name: server-macos
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            artifact_name: server-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 前端构建（仍用 Node/pnpm）
      - name: Frontend install & build
        working-directory: frontend
        run: |
          npm install -g pnpm@8.15.5
          pnpm install --frozen-lockfile
          pnpm run build:prod

      # 后端跨平台编译（纯 Go，无 CGO；单文件二进制天然取代 @yao-pkg/pkg）
      - name: Build backend (go cross compile)
        working-directory: backend
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../dist/web ../dist/migrations
          cp -r ../frontend/dist/* ../dist/web/
          cp migrations/schema.sql ../dist/migrations/schema.sql
          cp .env.production ../dist/.env
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o ../dist/server${{ matrix.ext }} .

      # 打包为 zip：含 server / web / migrations / .env，解压即可运行。
      # 各 runner 自带工具不同（Windows 无 zip），故按平台分两步。
      - name: Package zip (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          zip -r "../${{ matrix.artifact_name }}.zip" server${{ matrix.ext }} web migrations .env
          cd ..
          ls -lh "${{ matrix.artifact_name }}.zip"

      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/server.exe, dist/web, dist/migrations, dist/.env `
            -DestinationPath "${{ matrix.artifact_name }}.zip" -Force
          Get-Item "${{ matrix.artifact_name }}.zip" | Format-List Name, Length

      # 临时取用与人工检查（7 天后过期）；长期留存靠下面的 Release 附件
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 7

  # 三个平台构建完成后统一发布，避免三个 job 并发创建/更新同一个 Release。
  release:
    needs: pkg
    # 手动试跑时 github.ref 是分支名，此时跳过上传，只做构建验证。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # 上传 Release 附件所需
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Upload zip files to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          fail_on_unmatched_files: true
