name: Build Native Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  pkg:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
            artifact_name: server-linux
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ''
            artifact_name: server-macos
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            artifact_name: server-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 前端构建（仍用 Node/pnpm）
      - name: Frontend install & build
        working-directory: frontend
        run: |
          npm install -g pnpm@8.15.5
          pnpm install --frozen-lockfile
          pnpm run build:prod

      # 后端跨平台编译（纯 Go，无 CGO；单文件二进制天然取代 @yao-pkg/pkg）
      - name: Build backend (go cross compile)
        working-directory: backend
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../dist/web ../dist/migrations
          cp -r ../frontend/dist/* ../dist/web/
          cp migrations/schema.sql ../dist/migrations/schema.sql
          cp .env.production ../dist/.env
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o ../dist/server${{ matrix.ext }} .

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/server${{ matrix.ext }}
          retention-days: 7
